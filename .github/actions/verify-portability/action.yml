name: Verify portability
description: Verify facts, CommonMark inventory, comparison, and private compiler-host packages without publishing.
inputs:
  pair-stage:
    description: Existing sealed private pair from the artifact tests; omitted for standalone verification.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      run: dotnet restore tests/Syntamark.Portability --locked-mode
    - shell: bash
      run: dotnet run --project tests/Syntamark.Portability -c Release --no-restore
    - name: Inventory CommonMark and compare shared facts
      shell: bash
      run: |
        for project in tests/Syntamark.Conformance tests/Syntamark.Comparison tests/Syntamark.Safety; do
          dotnet restore "$project" --locked-mode
        done
        dotnet run --project tests/Syntamark.Conformance -c Release --no-restore -- --syntax --revision "$GITHUB_SHA" --output .local/commonmark
        dotnet run --project tests/Syntamark.Conformance -c Release --no-restore -- --profile commonmark/0.31.2 --syntax --strict --revision "$GITHUB_SHA" --output .local/commonmark-standard
        dotnet run --project tests/Syntamark.Comparison -c Release --no-restore -- --output .local/comparison/current.json
        dotnet run --project tests/Syntamark.Comparison -c Release --no-restore -- --commonmark-output .local/commonmark-comparison
        dotnet run --project tests/Syntamark.Safety -c Release --no-restore > .local/safety.log
    - name: Verify prose through the public syntax API
      shell: bash
      run: |
        dotnet restore samples/Syntamark.Prose --locked-mode
        dotnet run --project samples/Syntamark.Prose -c Release --no-restore > .local/prose.log
    - name: Verify the local portable source in the compiler host
      shell: pwsh
      run: |
        ./tests/Syntamark.Roslyn.Integration/Verify.ps1
    - name: Build reproducible benchmarks without timing gates
      shell: bash
      run: |
        export SyntamarkAnalysis=true
        for project in benchmarks/Syntamark.Benchmarks benchmarks/Syntamark.Comparison; do
          dotnet restore "$project" --locked-mode
          dotnet build "$project" -c Release --no-restore -p:SyntamarkAssembly="$GITHUB_WORKSPACE/src/Syntamark/bin/Release/net10.0/Syntamark.dll"
        done
    - name: Verify formatting
      shell: bash
      run: |
        export SyntamarkAnalysis=true
        export SyntamarkAssembly="$GITHUB_WORKSPACE/src/Syntamark/bin/Release/net10.0/Syntamark.dll"
        for project in src/Syntamark/Syntamark.csproj tests/Syntamark.Portability/Syntamark.Portability.csproj tests/Syntamark.Conformance/Syntamark.Conformance.csproj tests/Syntamark.Comparison/Syntamark.Comparison.csproj tests/Syntamark.Roslyn.Integration/Syntamark.Roslyn.Integration.csproj tests/Syntamark.Safety/Syntamark.Safety.csproj samples/Syntamark.Prose/Syntamark.Prose.csproj benchmarks/Syntamark.Benchmarks/Syntamark.Benchmarks.csproj benchmarks/Syntamark.Comparison/Syntamark.Comparison.csproj; do
          dotnet format style "$project" --diagnostics IDE2001 --exclude src/Syntamark/Portable/MarkdownParserVersion.g.cs --no-restore --verify-no-changes
          dotnet format whitespace "$project" --exclude src/Syntamark/Portable/MarkdownParserVersion.g.cs --no-restore --verify-no-changes
        done
        # The immutable source dependency has its own historical style; check the authored sample only.
        dotnet format style samples/Syntamark.Roslyn/Syntamark.Roslyn.csproj --diagnostics IDE2001 --include samples/Syntamark.Roslyn/MarkdownTodoAnalyzer.cs --no-restore --verify-no-changes
        dotnet format whitespace samples/Syntamark.Roslyn/Syntamark.Roslyn.csproj --include samples/Syntamark.Roslyn/MarkdownTodoAnalyzer.cs --no-restore --verify-no-changes
    - name: Prepare a private runtime and Source pair
      if: inputs.pair-stage == ''
      shell: bash
      run: |
        node eng/markdown/New-ArtifactPair.mjs prepare "$GITHUB_SHA" 2.0.0-preview.2026111303 "$RUNNER_TEMP/syntamark-canary"
        for kind in runtime source; do
          dotnet restore "$RUNNER_TEMP/syntamark-canary/$kind/$kind.csproj" --configfile "$RUNNER_TEMP/syntamark-canary/NuGet.Config" --packages "$RUNNER_TEMP/syntamark-canary/packages"
        done
        node eng/markdown/New-ArtifactPair.mjs check-stage "$RUNNER_TEMP/syntamark-canary"
        for kind in runtime source; do
          dotnet pack "$RUNNER_TEMP/syntamark-canary/$kind/$kind.csproj" -c Release --no-restore -o "$RUNNER_TEMP/syntamark-canary/feed"
        done
        node eng/markdown/New-ArtifactPair.mjs seal "$RUNNER_TEMP/syntamark-canary"
    - name: Verify restored packages and the compiler host
      shell: pwsh
      env:
        EXISTING_PAIR_STAGE: ${{ inputs.pair-stage }}
      run: |
        $stage = if ($env:EXISTING_PAIR_STAGE) { $env:EXISTING_PAIR_STAGE } else { Join-Path $env:RUNNER_TEMP 'syntamark-canary' }
        ./eng/markdown/Verify-ArtifactPair.ps1 -Stage $stage
