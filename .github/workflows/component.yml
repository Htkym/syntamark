name: Markdown component
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Formal Markdown pair {0}', inputs.component_version) || 'Markdown component verification' }}
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      component_version:
        description: Fresh immutable 1.0.0, 1.0.1 or 2.0.0-preview.N version
        required: true
        type: string
env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
permissions:
  contents: read
  actions: read
concurrency:
  group: component-${{ inputs.component_version || github.run_id }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Require reviewed main and its normal CI
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./eng/Test-MainRelease.ps1 -CiWorkflow component.yml
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: dotnet restore tests/Syntamark.Portability --locked-mode
      - run: dotnet run --project tests/Syntamark.Portability -c Release --no-restore
      - name: Refuse repeated formal issuance
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT_VERSION: ${{ inputs.component_version }}
        run: |
          gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/component.yml/runs" -f branch=main -f event=workflow_dispatch -f per_page=100 > previous-runs.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          assert(/^(?:1\.0\.[01]|2\.0\.0-preview\.[1-9][0-9]*)$/.test(process.env.COMPONENT_VERSION), 'Select a fresh supported version');
          assert.equal(process.env.GITHUB_RUN_ATTEMPT, '1', 'Formal pairs cannot be regenerated by a rerun');
          const title = 'Formal Markdown pair ' + process.env.COMPONENT_VERSION;
          const prior = JSON.parse(fs.readFileSync('previous-runs.json')).flatMap(page => page.workflow_runs);
          assert(!prior.some(run => BigInt(run.id) < BigInt(process.env.GITHUB_RUN_ID) && run.event === 'workflow_dispatch' && run.head_branch === 'main' && run.path === '.github/workflows/component.yml' && run.display_title === title), 'A formal issuance attempt already exists; preserve it for review');
          JS
      - name: Prepare formal pair
        if: github.event_name == 'workflow_dispatch'
        env:
          COMPONENT_VERSION: ${{ inputs.component_version }}
        run: node eng/markdown/New-ArtifactPair.mjs prepare "$GITHUB_SHA" "$COMPONENT_VERSION" "$RUNNER_TEMP/markdown-pair"
      - name: Pack formal pair
        if: github.event_name == 'workflow_dispatch'
        run: |
          dotnet restore "$RUNNER_TEMP/markdown-pair/runtime/runtime.csproj" --configfile "$RUNNER_TEMP/markdown-pair/NuGet.Config" --packages "$RUNNER_TEMP/markdown-pair/packages"
          dotnet restore "$RUNNER_TEMP/markdown-pair/source/source.csproj" --configfile "$RUNNER_TEMP/markdown-pair/NuGet.Config" --packages "$RUNNER_TEMP/markdown-pair/packages"
          node eng/markdown/New-ArtifactPair.mjs check-stage "$RUNNER_TEMP/markdown-pair"
          dotnet pack "$RUNNER_TEMP/markdown-pair/runtime/runtime.csproj" -c Release --no-restore -o "$RUNNER_TEMP/markdown-pair/feed"
          dotnet pack "$RUNNER_TEMP/markdown-pair/source/source.csproj" -c Release --no-restore -o "$RUNNER_TEMP/markdown-pair/feed"
          node eng/markdown/New-ArtifactPair.mjs seal "$RUNNER_TEMP/markdown-pair"
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: main-markdown-pair-${{ inputs.component_version }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/markdown-pair/feed/*.nupkg
            ${{ runner.temp }}/markdown-pair/pair-manifest.json
          if-no-files-found: error
